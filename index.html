<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Streamlabs Desktop</title>
  <style>
    :root { --purple: #8B00FF; }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0d0d0d;
      color: white;
      overflow: hidden;
      height: 100vh;
    }
    .header {
      background: #111;
      padding: 10px 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 3px solid var(--purple);
    }
    .scenes {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .scene-btn {
      padding: 8px 16px;
      background: #222;
      border: 2px solid #444;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.3s;
    }
    .scene-btn.active {
      background: var(--purple);
      border-color: white;
      box-shadow: 0 0 15px rgba(139,0,255,0.7);
    }

    .main {
      display: flex;
      height: calc(100vh - 52px);
    }
    .preview {
      flex: 1;
      position: relative;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    #screenMirror {
      max-width: 100%;
      max-height: 100%;
      border: 4px solid var(--purple);
      box-shadow: 0 0 40px rgba(139, 0, 255, 0.8);
    }
    .mascot {
      position: absolute;
      width: 150px;
      border: 4px solid var(--purple);
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(0,0,0,0.9);
    }
    .bottom-left { bottom: 30px; left: 30px; }
    .top-right { top: 30px; right: 30px; }

    .sidebar {
      width: 420px;
      background: #111;
      display: flex;
      flex-direction: column;
    }
    .chat-header {
      background: #1a1a1a;
      padding: 12px;
      text-align: center;
      font-weight: bold;
      border-bottom: 3px solid var(--purple);
    }
    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      background: #0a0a0a;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .message {
      font-size: 15px;
      line-height: 1.4;
    }
    .username { color: #00ffaa; font-weight: 600; }

    .bottom-bar {
      background: #111;
      padding: 10px 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      border-top: 2px solid var(--purple);
    }
    .live { color: #ff0044; font-weight: bold; animation: pulse 1.5s infinite; }
    @keyframes pulse { 50% { opacity: 0.4; } }
  </style>
</head>
<body>

  <div class="header">
    <div>Streamlabs Desktop • KEVINDBLIVE</div>
    <div class="scenes">
      <div class="scene-btn active" onclick="switchScene(0)">Starting Soon</div>
      <div class="scene-btn" onclick="switchScene(1)">Main Scene</div>
      <div class="scene-btn" onclick="switchScene(2)">Chat Only</div>
      <div class="scene-btn" onclick="switchScene(3)">Be Right Back</div>
      <div class="scene-btn" onclick="switchScene(4)">Ending Soon</div>
    </div>
    <div><span class="live">● LIVE</span> 437 viewers</div>
  </div>

  <div class="main">
    <div class="preview" id="previewArea">
      <video id="screenMirror" autoplay playsinline></video>
      
      <img id="mascot1" src="https://i.imgur.com/yourpurplecat.png" class="mascot bottom-left" alt="">
      <img id="mascot2" src="https://i.imgur.com/yourpurplecat.png" class="mascot top-right" alt="">
    </div>

    <div class="sidebar">
      <div class="chat-header">Twitch Chat • 7TV Emotes</div>
      <div class="chat" id="chat"></div>
    </div>
  </div>

  <div class="bottom-bar">
    <div>1.1% CPU • 60 FPS • <span id="currentScene">Main Scene</span></div>
    <div id="streamTitle">Chill Vibes • Come hang out 💜</div>
    <button onclick="endStream()" style="background:#c00;color:white;border:none;padding:8px 20px;border-radius:6px;cursor:pointer;">
      End Stream
    </button>
  </div>

  <script>
    let video = document.getElementById('screenMirror');
    let currentScene = 1;

    async function startScreenMirror() {
      try {
        const stream = await navigator.mediaDevices.getDisplayMedia({ 
          video: { cursor: "always" }, 
          audio: false 
        });
        video.srcObject = stream;
      } catch (e) {}
    }

    document.getElementById('previewArea').addEventListener('click', startScreenMirror);

    const emotes = {
      poggers: "https://cdn.7tv.app/emote/60ae4f9c9c5b0c0000000000/2x",
      kekw: "https://cdn.7tv.app/emote/60ae4f9c9c5b0c0000000001/2x",
      monkaW: "https://cdn.7tv.app/emote/60ae4f9c9c5b0c0000000002/2x",
      catjam: "https://cdn.7tv.app/emote/60ae7316f7c927fad14e6ca2/2x",
      omegalul: "https://cdn.7tv.app/emote/60ae4f9c9c5b0c0000000004/2x",
      prayge: "https://cdn.7tv.app/emote/60ae4f9c9c5b0c0000000005/2x",
      sadge: "https://cdn.7tv.app/emote/60ae4f9c9c5b0c0000000006/2x"
    };

    const sceneReactions = {
      0: [ // Starting Soon
        {text: "Stream starting!!!", emote: "poggers"},
        {text: "LETS GOOOOO", emote: "poggers"},
        {text: "Finally! Been waiting", emote: "catjam"},
        {text: "Hyped af Prayge", emote: "prayge"}
      ],
      1: [ // Main Scene
        {text: "KEKW", emote: "kekw"},
        {text: "insane", emote: "monkaW"},
        {text: "nice one", emote: "poggers"},
        {text: "OMEGALUL", emote: "omegalul"}
      ],
      2: [ // Chat Only
        {text: "Chat is so active today", emote: "catjam"},
        {text: "Love talking with you guys", emote: "prayge"},
        {text: "This community is great", emote: "poggers"}
      ],
      4: [ // Ending Soon
        {text: "Sadge stream ending...", emote: "sadge"},
        {text: "Nooo already?", emote: "sadge"},
        {text: "Thanks for the stream", emote: "prayge"},
        {text: "See you next time Sadge", emote: "sadge"}
      ]
    };

    function addChatMessage(scene = currentScene) {
      const chat = document.getElementById('chat');
      const usernames = ["PogKing", "catEnjoyer", "KEKWLord", "ChillVibes", "SnipeGod", "BasedChad"];
      const username = usernames[Math.floor(Math.random() * usernames.length)];

      let reactionList = sceneReactions[scene] || sceneReactions[1];
      const reaction = reactionList[Math.floor(Math.random() * reactionList.length)];

      const msg = document.createElement('div');
      msg.className = 'message';
      msg.innerHTML = `
        <span class="username">${username}:</span> 
        ${reaction.text} <img src="${emotes[reaction.emote]}" style="height:26px;vertical-align:middle;">
      `;
      chat.appendChild(msg);
      chat.scrollTop = chat.scrollHeight;
    }

    setInterval(() => {
      if (currentScene === 0 || currentScene === 1 || currentScene === 2) {
        addChatMessage();
      } else if (currentScene === 4 && Math.random() > 0.35) {
        addChatMessage();
      }
    }, 1250);

    // Initial chat messages
    for(let i = 0; i < 12; i++) addChatMessage();

    window.switchScene = function(n) {
      currentScene = n;
      document.querySelectorAll('.scene-btn').forEach((btn, i) => {
        btn.classList.toggle('active', i === n);
      });
      document.getElementById('currentScene').textContent = 
        ["Starting Soon", "Main Scene", "Chat Only", "Be Right Back", "Ending Soon"][n];

      if (n === 0 || n === 4) addChatMessage(n);
    };

    function endStream() {
      if (confirm("End Stream?")) {
        document.body.innerHTML = `<h1 style="text-align:center; margin-top:20%; color:#ff3366; font-size:3em;">
          STREAM ENDED<br><br>Thanks for watching 💜
        </h1>`;
      }
    }

    window.onload = () => setTimeout(startScreenMirror, 600);
  </script>
</body>
</html>
